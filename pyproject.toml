[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratio-dia"
version = "0.1.0"
description = "Activity-guided topology focusing for DIA-MS/MS molecular networks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "RATIO-DIA authors"}]
dependencies = ["numpy>=1.23"]
keywords = ["mass spectrometry", "DIA", "molecular networking", "natural products"]

[project.scripts]
ratio-dia = "ratio_dia.pipeline:main"
ratio-dia-structure = "ratio_dia.structure_consistency:main"

[project.optional-dependencies]
structure = ["rdkit>=2023.9"]

[tool.setuptools.packages.find]
where = ["src"]
